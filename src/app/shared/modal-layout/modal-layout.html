<div class="modal-bg" (click) = "cerrar()">
  <div class="modal-content" [class.no-padding]="hideHeader" (click) = "$event.stopPropagation()">
    @if(!hideHeader) {
      <header class="modal-content-header">
        <h1>{{titulo}}</h1>
        <div class="header-divider"></div>
      </header>
    }
    <ng-content></ng-content>
  </div>
</div>
